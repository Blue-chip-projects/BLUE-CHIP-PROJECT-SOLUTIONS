name: Search discovery checks and IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "_headers"
      - "_redirects"
      - "scripts/**"
      - ".github/workflows/indexnow.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Check public pages and crawler configuration
        run: python scripts/check_search.py
      - name: Check indexing failure cases
        run: python -m unittest discover -s scripts -p 'test_*.py'

  submit:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: indexnow-production
      cancel-in-progress: true
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Wait for this commit to be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/wait_for_deployment.py

      - name: Verify live public pages before notifying search engines
        run: python scripts/check_search.py --live

      - name: Build IndexNow payload from sitemap
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          key_file = "5ba54a09c02a245117bd2c602394e6c855172bfbd0034ad7.txt"
          key = open(key_file, encoding="utf-8").read().strip()

          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          root = ET.parse("sitemap.xml").getroot()
          urls = [n.text.strip() for n in root.findall("s:url/s:loc", ns) if n.text]

          payload = {
              "host": "jenasaro.com",
              "key": key,
              "keyLocation": f"https://jenasaro.com/{key}.txt",
              "urlList": urls,
          }

          with open("indexnow.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

      - name: Notify IndexNow
        run: |
          code=$(curl --connect-timeout 10 --max-time 60 -sS -o indexnow-response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json \
            https://api.indexnow.org/indexnow)

          echo "IndexNow HTTP status: $code"

          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            cat indexnow-response.txt || true
            exit 1
          fi

          echo "Search checks passed and IndexNow accepted the notification (HTTP $code). Acceptance does not confirm indexing." >> "$GITHUB_STEP_SUMMARY"
